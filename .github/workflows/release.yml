name: "AURORA Kaushal IDM - Multi-Platform Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: "Build All Platforms & Publish GitHub Release"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, x86_64-pc-windows-gnu, x86_64-unknown-linux-gnu

      - name: Install System Packaging Tools & MinGW Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            zip \
            unzip \
            tar \
            gzip \
            mingw-w64 \
            gcc-multilib \
            libssl-dev \
            pkg-config

      - name: Install wasm-bindgen CLI
        run: |
          cargo install wasm-bindgen-cli --version 0.2.100 || cargo install wasm-bindgen-cli --locked

      - name: Build All Browser Extensions (Chrome, Brave, Edge, Firefox, Safari)
        run: |
          bash scripts/build_extension.sh all

      - name: Build All Desktop Packages (.deb, Windows .exe, macOS bundle, .tar.gz)
        run: |
          cargo build --release -p aurora-gui
          cargo build --release -p aurora-gui --target x86_64-pc-windows-gnu
          bash scripts/package_desktop.sh

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "AURORA Kaushal IDM ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/aurora-kaushal-idm_*_amd64.deb
            dist/aurora-kaushal-idm-*-windows-x64.zip
            dist/aurora-kaushal-idm-*-linux-x86_64.tar.gz
            dist/aurora-kaushal-idm-*-macos.zip
            dist/aurora-chrome-*.zip
            dist/aurora-brave-*.zip
            dist/aurora-edge-*.zip
            dist/aurora-firefox-*.xpi
            dist/aurora-firefox-*.zip
            dist/aurora-safari-*.zip
            dist/SHA256SUMS.txt
