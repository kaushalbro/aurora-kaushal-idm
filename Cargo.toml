[workspace]
resolver = "2"
members = [
    "crates/aurora-core",
    "crates/aurora-storage",
    "crates/aurora-http",
    "crates/aurora-metrics",
    "crates/aurora-recovery",
    "crates/aurora-scheduler",
    "crates/aurora-history",
    "crates/aurora-benchmark",
    "apps/aurora-cli",
    "apps/aurora-gui",
    "apps/aurora-desktop/src-tauri",
    "crates/aurora-wasm",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["AURORA Development Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aurora-idm/aurora"

[workspace.dependencies]
# Internal workspace crates
aurora-core = { path = "crates/aurora-core" }
aurora-storage = { path = "crates/aurora-storage" }
aurora-http = { path = "crates/aurora-http" }
aurora-metrics = { path = "crates/aurora-metrics" }
aurora-recovery = { path = "crates/aurora-recovery" }
aurora-scheduler = { path = "crates/aurora-scheduler" }
aurora-history = { path = "crates/aurora-history" }
aurora-benchmark = { path = "crates/aurora-benchmark" }

# Async runtime & networking
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
hyper = { version = "1.4", features = ["full"] }
bytes = "1.7"
url = { version = "2.5", features = ["serde"] }
http = "1.1"
futures-util = "0.3"
async-stream = "0.3"

# Serialization & storage
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }

# Cryptography & Integrity
sha2 = "0.10"
blake3 = "1.5"

# Observability & Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"

# CLI & GUI
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = { version = "0.17", features = ["tokio"] }
egui = "0.28"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
rand = "0.8"

# Testing & Mock Server
axum = { version = "0.7", features = ["tokio", "http2"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
